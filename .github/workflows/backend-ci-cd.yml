name: Backend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'Server/**'
      - 'Dockerfile'
  push:
    branches: [main]
    paths:
      - 'Server/**'
      - 'Dockerfile'

env:
  GO_VERSION: '1.25'
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ${{ secrets.AWS_REGION }}

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server/MuchToDo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Server/MuchToDo/go.sum

      - name: Run unit tests
        run: go test -v -race -count=1 ./...

      - name: Run integration tests
        run: go test -tags=integration -v ./...
        env:
          INTEGRATION: "true"

      - name: Code quality (go vet)
        run: go vet ./...

      - name: govulncheck (report only)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image-uri: ${{ steps.meta.outputs.image-uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: meta
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          LATEST_URI="${REGISTRY}/${{ env.ECR_REPOSITORY }}:latest"

          docker build -t "$IMAGE_URI" -t "$LATEST_URI" .

          echo "image-uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image-uri }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Push Docker images to ECR
        run: |
          REGISTRY="${{ steps.meta.outputs.registry }}"
          docker push "${REGISTRY}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          docker push "${REGISTRY}/${{ env.ECR_REPOSITORY }}:latest"

          echo "Pushed images:"
          echo "  ${{ steps.meta.outputs.image-uri }}"
          echo "  ${REGISTRY}/${{ env.ECR_REPOSITORY }}:latest"

  deploy-backend:
    name: Deploy to EC2 (Rolling)
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger ASG instance refresh (rolling deploy)
        run: |
          # Cancel any in-progress refresh and wait until fully cancelled
          aws autoscaling cancel-instance-refresh \
            --auto-scaling-group-name starttech-backend-asg 2>/dev/null || true
          for i in $(seq 1 12); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name starttech-backend-asg \
              --query 'InstanceRefreshes[0].Status' --output text 2>/dev/null || echo "None")
            echo "Cancel status: $STATUS"
            if [[ "$STATUS" == "Cancelled" || "$STATUS" == "None" || "$STATUS" == "Successful" || "$STATUS" == "Failed" ]]; then
              break
            fi
            sleep 10
          done

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name starttech-backend-asg \
            --strategy Rolling \
            --preferences MinHealthyPercentage=50,InstanceWarmup=120 \
            --query InstanceRefreshId \
            --output text)
          echo "Instance refresh started: $REFRESH_ID"
          echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_ENV

      - name: Wait for instance refresh to complete
        run: |
          echo "Polling refresh status (max 20 minutes)..."
          for i in $(seq 1 40); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name starttech-backend-asg \
              --query "InstanceRefreshes[?InstanceRefreshId=='${REFRESH_ID}'].Status" \
              --output text)
            echo "Attempt $i/40 — Status: $STATUS"
            case "$STATUS" in
              Successful)
                echo "Instance refresh completed successfully."
                exit 0
                ;;
              Failed|Cancelled|Cancelling)
                echo "Instance refresh $STATUS. Deployment failed."
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for instance refresh."
          exit 1

      - name: Smoke test – verify /ping endpoint
        run: |
          ALB_DNS="${{ secrets.ALB_DNS_NAME }}"
          echo "Running health check against http://$ALB_DNS/ping"
          for i in $(seq 1 10); do
            echo "Attempt $i/10..."
            RESPONSE=$(curl -sf "http://$ALB_DNS/ping" 2>/dev/null || true)
            if echo "$RESPONSE" | grep -qi "pong"; then
              echo "Health check PASSED: $RESPONSE"
              exit 0
            fi
            sleep 15
          done
          echo "Health check FAILED after 10 attempts"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "### Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag:** \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ASG:** \`starttech-backend-asg\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy:** Rolling (50% min healthy)" >> $GITHUB_STEP_SUMMARY
